# Para refrescar las versiones, ejecutar:
#   curl -sL https://updates.jenkins.io/dynamic-stable-2.568.2/update-center.json
#   | python3 -c "import json,sys,re; r=sys.stdin.read(); m=re.match(r'updateCenter.post\((.+)\)',r,re.DOTALL); d=json.loads(m.group(1)); print('\n'.join(f'  - artifactId: \"{p}\"\n    source:\n      version: \"{d[\"plugins\"][p][\"version\"]}\"' for p in ['configuration-as-code', ...] if p in d['plugins']))"
# =====================================================================

