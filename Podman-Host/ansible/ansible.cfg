[defaults]
inventory = ./hosts.ini
host_key_checking = False
retry_files_enabled = False
forks = 10
deprecation_warnings = False
interpreter_python = /usr/bin/python3
nocows = 1
transport = paramiko
# Los mensajes multi-linea de "debug:" (ej. avisos de pass/crypta en
# podman_secrets_tooling) se veian con "\n" literales en vez de saltos
# de linea reales, porque el callback "default" usa formato JSON por
# defecto para el resultado de las tareas. "yaml" los muestra legibles.
callback_result_format = yaml

[privilege_escalation]
become_ask_pass = False
become_flags = -n

[ssh_connection]
pipelining = False
ssh_args = -o ControlMaster=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3
