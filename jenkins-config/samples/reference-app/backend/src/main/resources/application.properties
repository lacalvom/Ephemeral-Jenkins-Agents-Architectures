# Configuracion minima del backend de referencia.
# Puerto explicito para que coincida con lo que espera el frontend
# (ver frontend/src/app/hello.service.ts -> http://localhost:8080).
server.port=8080

spring.application.name=reference-backend

# Actuator: solo se expone /actuator/health, util para el HEALTHCHECK
# del Dockerfile y para probar el contenedor manualmente.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
