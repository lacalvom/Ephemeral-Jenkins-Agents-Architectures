---
# =====================================================================
# podman_secrets_tooling — defaults
# =====================================================================
# Variables parametrizables para los tres drivers de Podman Secrets.
# Por defecto SOLO se instala el binario base (sin crear secrets).
# Para crear un secret de ejemplo, pasar create_example_secrets=true
# junto a enabled_drivers con el driver deseado.
# =====================================================================

# --- Seleccion de drivers (sobreescribir desde el playbook) ---
enabled_drivers: []
create_example_secrets: false

# --- Binarios: versiones y URLs (verificadas en Sep 2026) ---
# NOTA: el tarball de age usa el prefijo "age-v" (con la v) en el nombre
age_version: "v1.3.2"
age_tarball_url: "https://github.com/FiloSottile/age/releases/download/{{ age_version }}/age-{{ age_version }}-linux-amd64.tar.gz"
age_install_dir: "/usr/local/bin"

sops_version: "v3.13.3"
sops_binary_url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.linux.amd64"
sops_install_dir: "/usr/local/bin"

# NOTA: 'crypta' (wrapper en Rust de sops+age usado por la guia original)
# se elimino del rol: TODAS sus versiones publicadas requieren
# glibc 2.39+, incompatible con AlmaLinux 9 (glibc 2.34). En su lugar,
# el driver 'shell' usa un script propio (ver template
# sops-shell-driver.sh.j2) que llama a sops+age directamente. Ver
# ADR-015.

# --- Clave GPG para el driver 'pass' ---
# El rol genera una clave GPG sin passphrase (automatización rootless).
# Para PRODUCCION: exportar una clave GPG real y configurar antes.
gpg_key_type: "RSA"
gpg_key_length: 2048
gpg_key_name_real: "Jenkins Podman Secrets"
gpg_key_email: "podman-secrets@jenkins-podman-lab.local"
gpg_key_expire: 0

# --- Clave age + almacen cifrado para el driver 'shell' (sops+age directo) ---
# NOTA: todas las tareas de este rol corren como root (become: true SIN
# become_user, ver ADR-005: Podman Secrets a nivel de sistema).
age_key_dir: "/root/.config/age"
age_key_file: "{{ age_key_dir }}/keys.txt"
podman_secrets_shell_store_dir: "/root/.config/podman-secrets-shell-store"
podman_secrets_shell_driver_script: "/usr/local/bin/podman-secret-sops-driver.sh"

# --- Paths de secrets de ejemplo (para smoke-tests) ---
# Cada driver crea un secret con un nombre distinto para que coexistan.
# Valor de EJEMPLO (no es una credencial real; los secretos reales se
# definen fuera de git).
example_secret_value: "valor-de-ejemplo"
example_secret_name_file: "api_token_prod_file"
example_secret_name_pass: "api_token_prod_pass"
example_secret_name_shell: "api_token_prod_shell"
